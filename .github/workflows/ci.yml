name: CodeGuard Pro CI

on:
  # Ejecutar CI en cada rama para que los cambios de trabajo también se validen.
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django checks and test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      CODEGUARD_DATA_DIR: /tmp/codeguard-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Validate Python syntax
        run: python -m compileall -q config apps server_entry.py manage.py

      - name: Django system check
        run: python manage.py check --settings=config.settings.development

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.development

      - name: Run Django test suite
        run: |
          python manage.py test \
            apps.core apps.accounts apps.audit apps.roadmaps \
            apps.tutoring apps.gamification apps.challenges \
            --settings=config.settings.development

  packaging:
    name: PyInstaller server build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.desktop
      CODEGUARD_DATA_DIR: /tmp/codeguard-packaging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build packaged server
        run: |
          python -m PyInstaller --clean --noconfirm \
            --distpath dist-server \
            --workpath build/pyinstaller-server \
            CodeGuardServer.spec

      - name: Smoke test packaged server
        run: bash scripts/smoke-test-packaged-server-linux.sh

  windows-package:
    name: Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 45
    # Validar Windows en el PR de release y en ejecuciones manuales, sin
    # ejecutarlo en cada push de ramas de trabajo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/release/1.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows server and installers
        shell: cmd
        run: npm run build:win

      - name: List generated artifacts
        shell: pwsh
        run: Get-ChildItem dist -Filter *.exe | Select-Object Name,Length

      - name: Windows installation acceptance
        shell: pwsh
        run: ./scripts/windows-acceptance.ps1
        env:
          CODEGUARD_DATA_DIR: ${{ runner.temp }}/codeguard-win-seed

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeguard-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  electron:
    name: Electron IPC unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Electron JavaScript syntax
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/ipc-security.js
          node --check electron/process-health.js
          node --check electron/restore-backup.js
          node --check electron/theme-preference.js
          node --check scripts/cdp-smoke.js
          node --check static/js/mundo/model.js
          node --check static/js/mundo/world.js
          node --check static/js/mundo/sprites.js
          node --check static/js/mundo/game.js

      - name: Run Electron unit tests
        run: npm run test:electron

      - name: Run Mundo CodeGuard model tests
        run: npm run test:mundo
